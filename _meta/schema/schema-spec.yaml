# Specificația mecanică a wiki-ului.
#
# Ce este acest fișier. Tot ce se poate verifica cu un script despre forma wiki-ului stă
# aici, o singură dată. Din el se generează două lucruri:
#   - partea mecanică din SCHEMA.md, între marcajele SCHEMA:BEGIN și SCHEMA:END,
#     prin `python _meta/schema/build_schema.py`;
#   - verificatorul `python _meta/schema/validate_wiki.py`, care citește regulile de aici
#     și le aplică fișierelor.
# Așa că SCHEMA.md nu poate spune una și verificatorul alta: amândouă citesc același text.
# Decizia D4 din _meta/plans/2026-09-05-plan-restructurare-wiki.md.
#
# Ce NU stă aici. Judecata: când merită o pagină, ce conține o pagină de entitate, cum se
# tratează o contradicție, ce înseamnă „ancorat”. Acelea rămân scrise de mână în SCHEMA.md
# și CLAUDE.md. Dacă o regulă de aici cere judecată ca să fie aplicată, e în locul greșit.
#
# Cum se schimbă o regulă. Se editează aici, se rulează build_schema.py, se rulează
# validate_wiki.py. O regulă nouă care aruncă erori vechi nu se relaxează ca să treacă:
# erorile vechi se arată lui Eugen și se decide ce se repară și ce se notează ca lacună.

version: '2026-09-05'

generated_into:
  file: SCHEMA.md
  begin: '<!-- SCHEMA:BEGIN - generated by _meta/schema/build_schema.py from _meta/schema/schema-spec.yaml, do not edit by hand -->'
  end: '<!-- SCHEMA:END -->'

# ---------------------------------------------------------------------------------------
# Straturile vault-ului. Fiecare folder are un rol și un set de reguli.
# ---------------------------------------------------------------------------------------
layers:
  # Stratul structurat: rezumate și analize scrise de model sau de Eugen. Se citează ca
  # analiză, niciodată ca lege. Folderul fixează tipul de pagină admis în el.
  structured:
    folders:
      entities: [entity]
      concepts: [concept]
      comparisons: [comparison]
      queries: [query, summary]

  # Stratul brut: text de sursă, imuabil. Singura excepție admisă sunt ancorele structurale
  # (titluri inserate deasupra liniilor originale), cu dovada că textul a rămas neschimbat.
  raw:
    roots:
      - path: raw/papers/cnpf
        perimeter: legal
      - path: raw/papers/moldova-legal
        perimeter: legal
      - path: raw/papers/bnm
        perimeter: legal
      - path: raw/papers/moldova-policy
        perimeter: policy
      - path: raw/papers/mded-policy-2024
        perimeter: policy
    # Fișiere din raw/ care sunt metadate, nu surse: nu li se cere frontmatter de sursă.
    metadata_prefixes: ['_', 'README']
    metadata_names: [BNM_LEGISLATION_INVENTORY.md, BNM_REPORTS_INVENTORY.md]
    # Fișiere de lucru extrase din DOCX, ținute în raw/ pentru trasabilitate. Nu sunt text
    # normativ și nu sunt surse ale perimetrului; li se cere frontmatter, dar nu poartă acte.
    working_paper_prefixes: ['md-']

  # Arhiva: conținut înghețat. Nu se verifică, dar poate fi ținta unei legături explicite.
  archive: _archive
  # Metadate, scripturi, planuri, jurnale vechi. Nu se verifică; nu e țintă de wikilink.
  meta: _meta

# ---------------------------------------------------------------------------------------
# Perimetre. Decizia D1: un singur vault, două perimetre declarate.
# ---------------------------------------------------------------------------------------
perimeters:
  values: [legal, policy]
  # O pagină juridică trebuie să aibă cel puțin o sursă dintr-o rădăcină juridică, o pagină
  # de politici cel puțin una dintr-o rădăcină de politici. O pagină poate cita din ambele;
  # perimetrul spune ce regulă de citare i se aplică, nu de unde are voie să citească.
  source_root_required: true

# ---------------------------------------------------------------------------------------
# Frontmatter. Ce câmpuri, ce valori.
# ---------------------------------------------------------------------------------------
frontmatter:
  structured:
    required: [title, created, updated, type, perimeter, tags, sources]
    optional: [confidence, contested, contradictions, imported_from, authority]
    enums:
      type: [entity, concept, comparison, query, summary]
      perimeter: [legal, policy]
      confidence: [high, medium, low]
    dates:
      format: 'YYYY-MM-DD'
      updated_not_before_created: true
      not_in_future: true
    tags:
      min: 1
      taxonomy_only: true
      # Fiecare pagină poartă și eticheta tipului ei (entity, concept, comparison, query, summary).
      must_include_type_tag: true
    sources:
      min: 1
      must_exist: true
    # Cel puțin două wikilink-uri distincte în corp. Sub prag: eticheta `needs-links`.
    min_outbound_wikilinks: 2

  raw:
    required: [source_url, ingested, sha256, source_type, publisher, language]
    enums:
      # `translation` este decizia D2: o traducere nu se ancorează și nu se citează ca text.
      source_type: [legal-text, translation, report, note, dataset, article, paper, transcript, webpage]
      language: [ro, en, ru, other]
    sha256:
      # Hash-ul se calculează peste corp, adică peste tot ce urmează după închiderea
      # frontmatter-ului. Două convenții există în corpus: peste octeții bruți, sau după
      # normalizarea CRLF -> LF. Fișierul poate declara convenția în `sha256_convention`.
      # Verificatorul acceptă oricare din cele două; dacă niciuna nu reproduce hash-ul,
      # e o eroare, pentru că înseamnă că textul s-a schimbat după ultima hashuire.
      conventions: [raw, LF]
      declared_field: sha256_convention
      # Când s-au adăugat ancore, hash-ul de dinainte se păstrează aici. Nu se verifică
      # mecanic (ar cere refacerea pasului de ancorare); e trasabilitate, nu control.
      pre_anchoring_field: sha256_pre_anchoring
    translation:
      # D2. O traducere nu poartă ancore `## Articolul`.
      anchors_forbidden: true
      anchor_pattern: '^## Articolul\s'
      # Un fișier cu multe linii `Article N` în corp și `source_type: legal-text` este cel
      # mai probabil o traducere nedeclarată. Avertisment, nu eroare, până la P9.
      english_marker: '^Article\s+\d'
      english_marker_min: 20

# ---------------------------------------------------------------------------------------
# Taxonomia etichetelor. Închisă: o etichetă nouă se adaugă aici înainte de a fi folosită.
# ---------------------------------------------------------------------------------------
tags:
  geography_and_institutions:
    [moldova, eu, accession, institution, donor, municipality, regional-development]
  policy_and_reform_areas:
    [economic-policy, macroeconomics, competitiveness, sme, investment, trade, infrastructure,
     digital-transformation, innovation, public-administration, regulatory-reform,
     legal-approximation, governance, anti-corruption, procurement, public-finance,
     labour-market, education-skills, energy, agriculture]
  financial_services_legal_approximation_cnpf:
    [cnpf, bnm, financial-services, financial-supervision, capital-market, securities, insurance,
     non-bank-credit, credit-bureau, pensions, company-law, consumer-protection, aml-cft,
     eu-acquis, transposition, legal-act, legal-source, import]
  evidence_indicators_methods:
    [indicator, composite-index, methodology, data-source, statistics, dashboard, evaluation,
     monitoring, theory-of-change, programme-design]
  document_and_knowledge_types:
    [entity, concept, comparison, query, summary, timeline, source-note, needs-links, contested]

# ---------------------------------------------------------------------------------------
# Wikilink-uri. Numele de bază ale actelor sunt ambigue în vault (entities/L-171-2012.md,
# raw/papers/cnpf/L-171-2012.md, copii în _archive/ și _meta/), deci regula de rezolvare
# trebuie fixată, altfel „[[L-171-2012]]” nu înseamnă nimic precis.
# ---------------------------------------------------------------------------------------
wikilinks:
  # Un nume simplu [[nume]] se rezolvă în această ordine; primul strat care îl conține câștigă.
  resolution_order: [structured, raw, root]
  # Aceste foldere se pot lega numai prin cale explicită, [[_archive/emir-2026-07/nume]].
  path_only_targets: [_archive, _meta]
  # Fișierele din raw/ nu se editează. Legăturile lor către pagini mutate în arhivă sunt
  # declarate aici și în nota de proveniență; verificatorul le acceptă ca excepție și
  # semnalează orice altă legătură raw -> _archive nedeclarată. Punctul deschis 3 din plan,
  # decis de Eugen la 2026-09-05: varianta strictă.
  raw_to_archive_exceptions:
    - file: raw/papers/cnpf/_manifest.md
      declared_in: _archive/emir-2026-07/_PROVENANCE.md
      targets:
        - verificare-schelet-lege-emir-2026-07-03
        - emir-draft-complet-2026-07-10
        - emir-audit-conformitate-lege100-hg1171-2026-07-10
    - file: raw/papers/cnpf/md-2026-07-03-schelet-lege-emir.md
      declared_in: _archive/emir-2026-07/_PROVENANCE.md
      targets:
        - verificare-schelet-lege-emir-2026-07-03

# ---------------------------------------------------------------------------------------
# index.md. Catalogul paginilor, pe perimetre, apoi pe tipuri.
# ---------------------------------------------------------------------------------------
index:
  file: index.md
  perimeter_sections:
    legal: '## Perimetrul juridic'
    policy: '## Perimetrul de politici'
  type_sections:
    entity: '### Entities'
    concept: '### Concepts'
    comparison: '### Comparisons'
    query: '### Queries'
    summary: '### Queries'
  # Fiecare pagină structurată apare exact o dată, sub perimetrul și tipul ei, ca
  # `- [[nume]] — rezumat`. Nimic listat fără fișier. Linia `Total pages: N` e numărată.
  entry_pattern: '^- \[\[([^\]\|#]+)(?:\|[^\]]*)?\]\]\s+—\s+\S'
  total_line: 'Total pages: '

# ---------------------------------------------------------------------------------------
# log.md. Decizia D8: git ține ce s-a schimbat, jurnalul ține ce s-a aflat și ce s-a decis.
# ---------------------------------------------------------------------------------------
log:
  file: log.md
  entry_header: '^## \[(\d{4}-\d{2}-\d{2})\] (create|update|ingest|archive|delete|lint|query|decision) \| .+$'
  # Fiecare intrare are cele trei rânduri, în această ordine.
  entry_fields: ['**Aflat:**', '**Decis:**', '**Unde:**']
  archive_dir: _meta/log

# ---------------------------------------------------------------------------------------
# Igienă. Erori tăcute care au apărut deja o dată în acest folder.
# ---------------------------------------------------------------------------------------
hygiene:
  # MSYS înlocuiește `:` și `\` din numele de fișiere cu U+F03A și U+F05C, deci un script
  # care primește o cale Windows sub Bash creează un folder care ARATĂ ca o cale reală.
  forbidden_name_chars: ["", ""]
  # Foldere goale sub aceste rădăcini sunt rămășițe și se semnalează. `queries/` poate fi gol,
  # dar poartă `.gitkeep`, deci nu e gol pentru această regulă.
  no_empty_dirs_under: [entities, concepts, comparisons, raw, _archive]
  # Secțiunea de acoperire din CLAUDE.md este generată; verificatorul întreabă dacă e la zi.
  coverage_check: [_meta/coverage/build_coverage.py, --check]
